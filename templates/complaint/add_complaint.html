{% extends 'layouts/dashboard_base.html' %}

{% block title %}File Complaint | SocietyConnect{% endblock %}

{% block content %}
<div class="table-container" style="max-width: 500px; margin: 0 auto;">
    <h2 class="table-title" style="margin-bottom: 1.5rem;">File Complaint Ticket</h2>
    
    <form action="{{ url_for('complaint.add_complaint') }}" method="POST">
        <div class="form-group">
            <label for="title" class="form-label">Title / Subject</label>
            <input type="text" id="title" name="title" class="form-control" placeholder="Brief summary of the issue" required>
        </div>
        
        <div class="form-group">
            <label for="category" class="form-label">Category</label>
            <select id="category" name="category" class="form-control form-select" required>
                <option value="Plumbing">Plumbing</option>
                <option value="Electrical">Electrical</option>
                <option value="Security">Security</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Other">Other / General</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" name="description" class="form-control" rows="5" placeholder="Explain the problem in detail so the maintenance team can understand it..." required></textarea>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary" style="flex: 1;">Cancel</a>
            <button type="submit" class="btn btn-primary" style="flex: 1;">File Ticket</button>
        </div>
    </form>
</div>
{% endblock %}
