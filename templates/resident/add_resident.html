{% extends 'layouts/dashboard_base.html' %}

{% block title %}Add Resident | SocietyConnect{% endblock %}

{% block content %}
<div class="table-container" style="max-width: 600px; margin: 0 auto;">
    <h2 class="table-title" style="margin-bottom: 1.5rem;">Add New Resident</h2>
    
    <form action="{{ url_for('resident.add_resident') }}" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required>
            </div>
            
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@domain.com" required>
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="password" class="form-label">Default Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter default password" required>
            </div>
            
            <div class="form-group">
                <label for="phone" class="form-label">Phone Number</label>
                <div class="phone-input-container">
                    <select name="country_code" class="form-control form-select phone-country-code" required>
                        <option value="+91" selected>+91 (IN)</option>
                        <option value="+1">+1 (US)</option>
                        <option value="+44">+44 (UK)</option>
                        <option value="+971">+971 (AE)</option>
                        <option value="+61">+61 (AU)</option>
                        <option value="+65">+65 (SG)</option>
                    </select>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="10-digit phone number" pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number" maxlength="10" required>
                </div>
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="building_id" class="form-label">Select Tower</label>
                <select id="building_id" class="form-control form-select" onchange="filterFlatsByBuilding()">
                    <option value="" selected>Unassigned (Select Tower to assign flat)</option>
                    {% for building in buildings %}
                        <option value="{{ building.id }}">{{ building.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="flat_id" class="form-label">Flat Number</label>
                <select id="flat_id" name="flat_id" class="form-control form-select">
                    <option value="" selected>Unassigned</option>
                    {% for flat in flats %}
                        <option value="{{ flat.id }}" data-building-id="{{ flat.building_id }}">{{ flat.flat_number }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="resident_type" class="form-label">Resident Type</label>
                <select id="resident_type" name="resident_type" class="form-control form-select" required>
                    <option value="Tenant">Tenant</option>
                    <option value="Owner">Owner</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="emergency_contact" class="form-label">Emergency Contact Name & Phone</label>
            <input type="text" id="emergency_contact" name="emergency_contact" class="form-control" placeholder="e.g. Mother: 9876543210">
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <a href="{{ url_for('resident.list_residents') }}" class="btn btn-secondary" style="flex: 1;">Cancel</a>
            <button type="submit" class="btn btn-primary" style="flex: 1;">Add Resident</button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
let allFlats = [];

document.addEventListener('DOMContentLoaded', () => {
    const flatSelect = document.getElementById('flat_id');
    if (flatSelect) {
        const options = flatSelect.querySelectorAll('option');
        options.forEach(opt => {
            if (opt.value !== "") {
                allFlats.push({
                    id: opt.value,
                    number: opt.innerText,
                    buildingId: opt.getAttribute('data-building-id')
                });
            }
        });
        filterFlatsByBuilding();
    }
});

function filterFlatsByBuilding() {
    const buildingSelect = document.getElementById('building_id');
    const flatSelect = document.getElementById('flat_id');
    if (!buildingSelect || !flatSelect) return;
    
    const selectedBuildingId = buildingSelect.value;
    
    // Clear and rebuild options
    flatSelect.innerHTML = '<option value="" selected>Unassigned</option>';
    
    if (!selectedBuildingId) return; // Keep unassigned only
    
    allFlats.forEach(flat => {
        if (flat.buildingId === selectedBuildingId) {
            const opt = document.createElement('option');
            opt.value = flat.id;
            opt.innerText = flat.number;
            flatSelect.appendChild(opt);
        }
    });
}
</script>
{% endblock %}
