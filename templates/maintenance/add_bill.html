{% extends 'layouts/dashboard_base.html' %}

{% block title %}Generate Bill | SocietyConnect{% endblock %}

{% block content %}
<div class="table-container" style="max-width: 540px; margin: 0 auto;">
    <h2 class="table-title" style="margin-bottom: 1.5rem;">Generate Maintenance Bill</h2>
    
    <form action="{{ url_for('maintenance.add_bill') }}" method="POST" id="bill-form">
        <div class="form-group">
            <label for="bill_type" class="form-label">Billing Type</label>
            <select id="bill_type" name="bill_type" class="form-control form-select" required onchange="toggleBillingFields()">
                <option value="Individual">Individual Flat</option>
                <option value="Bulk">Bulk (Whole Tower)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="title" class="form-label">Invoice Title</label>
            <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Monthly Maintenance Jan 2026" required>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="amount" class="form-label">Amount ($)</label>
                <input type="number" step="0.01" id="amount" name="amount" class="form-control" placeholder="0.00" required>
            </div>
            
            <div class="form-group">
                <label for="due_date" class="form-label">Due Date</label>
                <input type="date" id="due_date" name="due_date" class="form-control" required>
            </div>
        </div>

        <!-- Searchable Autocomplete Individual Flat Selection -->
        <div class="form-group" id="flat-selection-group">
            <label for="flat-search-input" class="form-label">Search Flat</label>
            <div class="autocomplete-container" id="autocomplete-wrapper">
                <input type="text" 
                       id="flat-search-input" 
                       class="form-control" 
                       placeholder="Search by flat, resident name, or tower..." 
                       autocomplete="off">
                <input type="hidden" id="flat_id" name="flat_id" value="">
                <div id="flat-dropdown-results" class="autocomplete-results" style="display: none;"></div>
            </div>
        </div>

        <!-- Bulk building selection -->
        <div class="form-group" id="building-selection-group" style="display: none;">
            <label for="building_id" class="form-label">Destination Building Tower</label>
            <select id="building_id" name="building_id" class="form-control form-select">
                <option value="" disabled selected>Select Tower</option>
                {% for building in buildings %}
                    <option value="{{ building.id }}">{{ building.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <a href="{{ url_for('maintenance.list_bills') }}" class="btn btn-secondary" style="flex: 1;">Cancel</a>
            <button type="submit" class="btn btn-primary" style="flex: 1;">Generate Invoice</button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
const flatsData = {{ flats_data|tojson }};
let filteredFlats = [];
let selectedIndex = -1;

function toggleBillingFields() {
    const billType = document.getElementById('bill_type').value;
    const flatGroup = document.getElementById('flat-selection-group');
    const buildingGroup = document.getElementById('building-selection-group');
    const buildingSelect = document.getElementById('building_id');
    
    if (billType === 'Individual') {
        flatGroup.style.display = 'block';
        buildingGroup.style.display = 'none';
        buildingSelect.required = false;
    } else {
        flatGroup.style.display = 'none';
        buildingGroup.style.display = 'block';
        buildingSelect.required = true;
    }
}

document.addEventListener('DOMContentLoaded', () => {
    toggleBillingFields();

    const searchInput = document.getElementById('flat-search-input');
    const flatHiddenInput = document.getElementById('flat_id');
    const resultsContainer = document.getElementById('flat-dropdown-results');
    const autocompleteWrapper = document.getElementById('autocomplete-wrapper');
    const form = document.getElementById('bill-form');

    function openDropdown(query = '') {
        const cleanQuery = query.trim().toLowerCase();
        if (cleanQuery === '') {
            filteredFlats = [...flatsData];
        } else {
            filteredFlats = flatsData.filter(item => {
                const flatNum = item.flat_number.toLowerCase();
                const bldgName = item.building_name.toLowerCase();
                const resName = item.resident_name.toLowerCase();
                return flatNum.includes(cleanQuery) || bldgName.includes(cleanQuery) || resName.includes(cleanQuery);
            });
        }

        selectedIndex = -1;
        resultsContainer.innerHTML = '';

        if (filteredFlats.length === 0) {
            const noResDiv = document.createElement('div');
            noResDiv.className = 'autocomplete-no-results';
            noResDiv.innerText = 'No matching flat found';
            resultsContainer.appendChild(noResDiv);
        } else {
            filteredFlats.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'autocomplete-item';
                if (flatHiddenInput.value == item.id) {
                    itemDiv.classList.add('selected');
                }
                
                // Format: Flat Number — Resident Name (e.g. A1-101 — Rahul Sharma)
                itemDiv.innerHTML = `
                    <span class="flat-label">${item.flat_number}</span>
                    <span class="resident-label">— ${item.resident_name} (${item.building_name})</span>
                `;

                itemDiv.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    selectItem(item);
                });

                resultsContainer.appendChild(itemDiv);
            });
        }

        resultsContainer.style.display = 'block';
    }

    function closeDropdown() {
        resultsContainer.style.display = 'none';
        selectedIndex = -1;
    }

    function selectItem(item) {
        searchInput.value = `${item.flat_number} — ${item.resident_name}`;
        flatHiddenInput.value = item.id;
        closeDropdown();
    }

    function updateHighlight() {
        const items = resultsContainer.querySelectorAll('.autocomplete-item');
        items.forEach((item, index) => {
            if (index === selectedIndex) {
                item.classList.add('highlighted');
                item.scrollIntoView({ block: 'nearest' });
            } else {
                item.classList.remove('highlighted');
            }
        });
    }

    // Event Listeners for Search Input
    searchInput.addEventListener('focus', () => {
        // If a selection was already made, clear or show full list
        openDropdown(searchInput.value.includes('—') ? '' : searchInput.value);
    });

    searchInput.addEventListener('click', () => {
        if (resultsContainer.style.display === 'none') {
            openDropdown(searchInput.value.includes('—') ? '' : searchInput.value);
        }
    });

    searchInput.addEventListener('input', (e) => {
        // Clear hidden input if user modifies text after selecting
        flatHiddenInput.value = '';
        openDropdown(e.target.value);
    });

    // Keyboard Navigation Support
    searchInput.addEventListener('keydown', (e) => {
        const isDropdownVisible = resultsContainer.style.display === 'block';

        if (e.key === 'ArrowDown') {
            if (!isDropdownVisible) {
                openDropdown(searchInput.value);
                return;
            }
            if (filteredFlats.length > 0) {
                e.preventDefault();
                selectedIndex = (selectedIndex + 1) % filteredFlats.length;
                updateHighlight();
            }
        } else if (e.key === 'ArrowUp') {
            if (isDropdownVisible && filteredFlats.length > 0) {
                e.preventDefault();
                selectedIndex = (selectedIndex - 1 + filteredFlats.length) % filteredFlats.length;
                updateHighlight();
            }
        } else if (e.key === 'Enter') {
            if (isDropdownVisible) {
                e.preventDefault();
                if (selectedIndex >= 0 && selectedIndex < filteredFlats.length) {
                    selectItem(filteredFlats[selectedIndex]);
                } else if (filteredFlats.length > 0) {
                    selectItem(filteredFlats[0]);
                }
            }
        } else if (e.key === 'Escape') {
            if (isDropdownVisible) {
                e.preventDefault();
                closeDropdown();
            }
        }
    });

    // Close dropdown on outside click
    document.addEventListener('click', (e) => {
        if (!autocompleteWrapper.contains(e.target)) {
            closeDropdown();
        }
    });

    // Form Submission Validation
    form.addEventListener('submit', (e) => {
        const billType = document.getElementById('bill_type').value;
        if (billType === 'Individual') {
            if (!flatHiddenInput.value) {
                e.preventDefault();
                alert('Please select a valid flat from the search dropdown.');
                searchInput.focus();
            }
        }
    });
});
</script>
{% endblock %}
