{% extends 'layouts/dashboard_base.html' %}

{% block title %}Log Visitor | SocietyConnect{% endblock %}

{% block content %}
<div class="table-container" style="max-width: 500px; margin: 0 auto;">
    <h2 class="table-title" style="margin-bottom: 1.5rem;">New Visitor entry</h2>
    
    <form action="{{ url_for('visitor.add_visitor') }}" method="POST">
        <div class="form-group">
            <label for="name" class="form-label">Visitor Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Full name" required>
        </div>
        
        <div class="form-group">
            <label for="phone" class="form-label">Phone Number</label>
            <div class="phone-input-container">
                <select name="country_code" class="form-control form-select phone-country-code" required>
                    <option value="+91" selected>+91 (IN)</option>
                    <option value="+1">+1 (US)</option>
                    <option value="+44">+44 (UK)</option>
                    <option value="+971">+971 (AE)</option>
                    <option value="+61">+61 (AU)</option>
                    <option value="+65">+65 (SG)</option>
                </select>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="10-digit number" pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number" maxlength="10" required>
            </div>
        </div>
        
        <div class="form-grid">
            <div class="form-group">
                <label for="building_id" class="form-label">Select Tower</label>
                <select id="building_id" class="form-control form-select" required onchange="filterFlatsByBuilding()">
                    <option value="" disabled selected>Select Tower</option>
                    {% for building in buildings %}
                        <option value="{{ building.id }}">{{ building.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="flat_id" class="form-label">Flat Visited</label>
                <select id="flat_id" name="flat_id" class="form-control form-select" required>
                    <option value="" disabled selected>Select Flat</option>
                    {% for flat in flats %}
                        <option value="{{ flat.id }}" data-building-id="{{ flat.building_id }}">{{ flat.flat_number }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label for="purpose" class="form-label">Purpose of Visit</label>
            <input type="text" id="purpose" name="purpose" class="form-control" placeholder="e.g. Delivery, Guest, Service" required>
        </div>
        
        <div class="form-group">
            <label for="vehicle_number" class="form-label">Vehicle Registration Number (Optional)</label>
            <input type="text" id="vehicle_number" name="vehicle_number" class="form-control" placeholder="e.g. MH-12-XX-1234">
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary" style="flex: 1;">Cancel</a>
            <button type="submit" class="btn btn-primary" style="flex: 1;">Log Entry</button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
let allFlats = [];

document.addEventListener('DOMContentLoaded', () => {
    const flatSelect = document.getElementById('flat_id');
    if (flatSelect) {
        const options = flatSelect.querySelectorAll('option');
        options.forEach(opt => {
            if (opt.value !== "") {
                allFlats.push({
                    id: opt.value,
                    number: opt.innerText,
                    buildingId: opt.getAttribute('data-building-id')
                });
            }
        });
        filterFlatsByBuilding();
    }
});

function filterFlatsByBuilding() {
    const buildingSelect = document.getElementById('building_id');
    const flatSelect = document.getElementById('flat_id');
    if (!buildingSelect || !flatSelect) return;
    
    const selectedBuildingId = buildingSelect.value;
    
    // Clear and rebuild options
    flatSelect.innerHTML = '<option value="" selected disabled>Select Flat</option>';
    
    allFlats.forEach(flat => {
        if (flat.buildingId === selectedBuildingId) {
            const opt = document.createElement('option');
            opt.value = flat.id;
            opt.innerText = flat.number;
            flatSelect.appendChild(opt);
        }
    });
}
</script>
{% endblock %}
