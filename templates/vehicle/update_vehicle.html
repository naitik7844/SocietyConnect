{% extends 'layouts/dashboard_base.html' %}

{% block title %}Edit Vehicle | SocietyConnect{% endblock %}

{% block content %}
<div class="table-container" style="max-width: 600px; margin: 0 auto;">
    <h2 class="table-title" style="margin-bottom: 1.5rem;">Update Vehicle Registration</h2>
    
    <form action="{{ url_for('vehicle.edit_vehicle', vehicle_id=vehicle.id) }}" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="building_id" class="form-label">Select Tower</label>
                <select id="building_id" class="form-control form-select" required onchange="filterFlatsByBuilding()">
                    {% for building in buildings %}
                        <option value="{{ building.id }}" {% if vehicle.flat and vehicle.flat.building_id == building.id %}selected{% endif %}>{{ building.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="flat_id" class="form-label">Flat Number</label>
                <select id="flat_id" name="flat_id" class="form-control form-select" required>
                    {% for flat in flats %}
                        <option value="{{ flat.id }}" data-building-id="{{ flat.building_id }}" {% if vehicle.flat_id == flat.id %}selected{% endif %}>{{ flat.flat_number }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="vehicle_number" class="form-label">Registration Number</label>
                <input type="text" id="vehicle_number" name="vehicle_number" value="{{ vehicle.vehicle_number }}" class="form-control" required style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label for="vehicle_type" class="form-label">Vehicle Type</label>
                <select id="vehicle_type" name="vehicle_type" class="form-control form-select" required>
                    <option value="4 Wheeler" {% if vehicle.vehicle_type == '4 Wheeler' %}selected{% endif %}>4 Wheeler (Car / SUV)</option>
                    <option value="2 Wheeler" {% if vehicle.vehicle_type == '2 Wheeler' %}selected{% endif %}>2 Wheeler (Bike / Scooter)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="owner_name" class="form-label">Owner Name</label>
            <input type="text" id="owner_name" name="owner_name" value="{{ vehicle.owner_name }}" class="form-control" required>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <a href="{{ url_for('vehicle.list_vehicles') }}" class="btn btn-secondary" style="flex: 1;">Cancel</a>
            <button type="submit" class="btn btn-primary" style="flex: 1;">Update Details</button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
let allFlats = [];
const currentFlatId = "{{ vehicle.flat_id }}";

document.addEventListener('DOMContentLoaded', () => {
    const flatSelect = document.getElementById('flat_id');
    if (flatSelect) {
        const options = flatSelect.querySelectorAll('option');
        options.forEach(opt => {
            if (opt.value !== "") {
                allFlats.push({
                    id: opt.value,
                    number: opt.innerText,
                    buildingId: opt.getAttribute('data-building-id')
                });
            }
        });
        filterFlatsByBuilding(currentFlatId);
    }
});

function filterFlatsByBuilding(preselectId) {
    const buildingSelect = document.getElementById('building_id');
    const flatSelect = document.getElementById('flat_id');
    if (!buildingSelect || !flatSelect) return;
    
    const selectedBuildingId = buildingSelect.value;
    flatSelect.innerHTML = '';
    
    allFlats.forEach(flat => {
        if (flat.buildingId === selectedBuildingId) {
            const opt = document.createElement('option');
            opt.value = flat.id;
            opt.innerText = flat.number;
            if (preselectId && String(flat.id) === String(preselectId)) {
                opt.selected = true;
            }
            flatSelect.appendChild(opt);
        }
    });
}
</script>
{% endblock %}
