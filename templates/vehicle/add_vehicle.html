{% extends 'layouts/dashboard_base.html' %}

{% block title %}Register Vehicle | SocietyConnect{% endblock %}

{% block content %}
<div class="table-container" style="max-width: 600px; margin: 0 auto;">
    <h2 class="table-title" style="margin-bottom: 1.5rem;">Register New Vehicle</h2>
    
    <form action="{{ url_for('vehicle.add_vehicle') }}" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="building_id" class="form-label">Select Tower</label>
                <select id="building_id" class="form-control form-select" required onchange="filterFlatsByBuilding()">
                    <option value="" disabled selected>Select Tower</option>
                    {% for building in buildings %}
                        <option value="{{ building.id }}">{{ building.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="flat_id" class="form-label">Flat Number</label>
                <select id="flat_id" name="flat_id" class="form-control form-select" required>
                    <option value="" disabled selected>Choose Flat</option>
                    {% for flat in flats %}
                        <option value="{{ flat.id }}" data-building-id="{{ flat.building_id }}">{{ flat.flat_number }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="vehicle_number" class="form-label">Registration Number</label>
                <input type="text" id="vehicle_number" name="vehicle_number" class="form-control" placeholder="e.g. MH-12-AB-1234" required style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label for="vehicle_type" class="form-label">Vehicle Type</label>
                <select id="vehicle_type" name="vehicle_type" class="form-control form-select" required>
                    <option value="4 Wheeler" selected>4 Wheeler (Car / SUV)</option>
                    <option value="2 Wheeler">2 Wheeler (Bike / Scooter)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="owner_name" class="form-label">Owner Name</label>
            <input type="text" id="owner_name" name="owner_name" class="form-control" placeholder="Resident or Vehicle Owner Name" required>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <a href="{{ url_for('vehicle.list_vehicles') }}" class="btn btn-secondary" style="flex: 1;">Cancel</a>
            <button type="submit" class="btn btn-primary" style="flex: 1;">Register Vehicle</button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
let allFlats = [];

document.addEventListener('DOMContentLoaded', () => {
    const flatSelect = document.getElementById('flat_id');
    if (flatSelect) {
        const options = flatSelect.querySelectorAll('option');
        options.forEach(opt => {
            if (opt.value !== "") {
                allFlats.push({
                    id: opt.value,
                    number: opt.innerText,
                    buildingId: opt.getAttribute('data-building-id')
                });
            }
        });
    }
});

function filterFlatsByBuilding() {
    const buildingSelect = document.getElementById('building_id');
    const flatSelect = document.getElementById('flat_id');
    if (!buildingSelect || !flatSelect) return;
    
    const selectedBuildingId = buildingSelect.value;
    flatSelect.innerHTML = '<option value="" selected disabled>Choose Flat</option>';
    
    allFlats.forEach(flat => {
        if (flat.buildingId === selectedBuildingId) {
            const opt = document.createElement('option');
            opt.value = flat.id;
            opt.innerText = flat.number;
            flatSelect.appendChild(opt);
        }
    });
}
</script>
{% endblock %}
